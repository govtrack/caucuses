name: Blue Dog Coalition
summary: Fiscally-Conservative and Strong National Defense
description: A group of Democrats formed this caucus after the 1994 midterm elections,
  in which Republicans retook the House of Representatives for the first time since
  1955, to explore bipartisan common ground on welfare reform and lower budget deficits.
  Members remain committed to more fiscally-conservative policies than most Democrats
  and strong national defense.
