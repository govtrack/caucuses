name: Problem Solvers Caucus
url: https://problemsolverscaucus.house.gov
summary: Bipartisan Policy Solutions
description: Members of this caucus join with a partner from the other side of the
  aisle, so it is evenly split between Republicans and Democrats. Problem Solvers
  meet regularly to identify issues with possible bipartisan support and endorse legislation
  if three-quarters of its members express support.
