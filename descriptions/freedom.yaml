name: Freedom Caucus
summary: Far-Right Federal Spending and Immigration Policy
description: Republicans associated with the Tea Party movement created the Freedom
  Caucus in 2015 to push their conference farther to the right on federal spending
  and immigration policy. It has leveraged its voting block to oppose House leaders
  who do not adopt its more conservative positions on spending and taxation, leading
  to the resignation of Speaker John Boehner and removal of Speaker Kevin McCarthy.
  It has hewed closer to support of the Trump Administrations than other Republican
  caucuses.
