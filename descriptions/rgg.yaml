name: Republican Governance Group
url: https://republicangovernance.com
description: Originally called the “Tuesday Lunch Bunch,” then the Tuesday Group,
  now known as RG2 was founded by Republican members who were less supportive of the
  conservative social and economic policies of the new House majority in 1994. It
  has trended toward Trump positions more recently, but its members typically stay
  out of the limelight.
